<html lang="fr">
<head>

<title>Picto Maths 974 — défis « 1 image, 1 question » à imprimer</title>
<style>
  :root {
    --cyan-600:#0891b2; --cyan-700:#0e7490; --cyan-800:#155e75;
    --teal-600:#0d9488; --teal-700:#0f766e;
    --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155;
    --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8;
    --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9;
    --amber-700:#b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2fbfd;
    color: var(--slate-700);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 48px; }

  /* Barre d'outils (écran seulement) */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: flex-end;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--slate-200);
    padding: 12px 20px;
  }
  .print-btn {
    cursor: pointer; border: 0;
    background: var(--cyan-600); color: #fff;
    font-weight: 800; font-size: 14px;
    padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(8,145,178,.3);
  }
  .print-btn:hover { background: #06b6d4; }

  .page {
    background: #fff;
    border: 1px solid var(--slate-200);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(148,163,184,.28);
    overflow: hidden;
    margin-top: 28px;
  }

  /* Couverture */
  .cover {
    text-align: center;
    padding: 40px 32px;
    background: linear-gradient(135deg, #ecfeff 0%, #ffffff 50%, #fffbeb 100%);
    border-radius: 24px;
  }
  .cover .volcan { font-size: 64px; line-height: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; font-weight: 800; font-size: 12px;
    padding: 4px 12px;
  }
  .chip-badge { background:#cffafe; color:var(--cyan-700); text-transform:uppercase; letter-spacing:.16em; }
  .cover h1 {
    margin: 14px 0 0; font-size: 52px; line-height: 1.05;
    letter-spacing: -.02em; color: var(--slate-900); font-weight: 900;
  }
  .cover h1 .dom {
    display:inline-block; margin-left:10px; padding:0 12px;
    background:#fcd34d; color:var(--slate-900); border-radius:16px;
  }
  .cover .baseline { margin: 12px 0 0; font-size: 18px; font-weight: 800; color: var(--slate-700); }
  .cover .look {
    margin-top: 12px; background:#cffafe; color:var(--cyan-800);
  }
  .cover .intro { margin: 16px auto 0; max-width: 560px; font-size: 14px; line-height: 1.6; color: var(--slate-600); font-weight: 600; }
  .cover .chips { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cover .chips .chip { font-size: 12px; }
  .c-cyan { background:#ecfeff; color:var(--cyan-700); }
  .c-teal { background:#f0fdfa; color:var(--teal-700); }
  .c-amber{ background:#fffbeb; color:var(--amber-700); }

  /* En-tête d'un défi */
  .band {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 24px; color:#fff;
    background: linear-gradient(90deg, var(--cyan-600), var(--teal-600));

  .band .theme { display:inline-flex; align-items:center; gap:8px; font-weight:900; font-size:14px; }
  .band .theme .emo { font-size:20px; line-height:1; }
  .band .ref { border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:2px 8px; font-size:11px; font-weight:900; font-variant-numeric: tabular-nums; }

  .body { padding: 24px; display:flex; flex-direction:column; gap:20px; }
  .lieu { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:900; color:var(--cyan-700); margin:0; }
  .lieu svg { width:14px; height:14px; }
  .question { text-align:center; font-size:30px; line-height:1.15; font-weight:900; color:var(--slate-900); margin:0; }

  .ardoise {
    position:relative; border:2px solid var(--slate-200); background:rgba(248,250,252,.6);
    border-radius:16px; padding:28px 16px;
  }
  .enonce { text-align:center; font-size:14px; font-weight:700; color:var(--slate-600); margin:0 0 20px; }

  /* Scène d'icônes */
  .scene { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .scene-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 12px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .icons { display:flex; align-items:flex-end; gap:2px; }
  .icons .emo { font-size:30px; line-height:1; }
  .icons .more { font-size:24px; font-weight:900; color:var(--slate-400); }
  .cap { text-align:center; font-size:12px; font-weight:900; color:var(--slate-600); }
  .val { border:2px solid #67e8f9; background:#ecfeff; color:var(--cyan-800); border-radius:12px; padding:6px 12px; font-size:16px; font-weight:900; }
  .qm { display:flex; width:44px; height:44px; align-items:center; justify-content:center; border:2px dashed #fbbf24; background:#fffbeb; color:#d97706; border-radius:12px; font-size:24px; font-weight:900; }
  .op { padding:0 2px; font-size:24px; font-weight:900; color:var(--slate-400); }

  .diagram-cap { text-align:center; font-size:12px; font-weight:900; color:var(--slate-600); margin-top:8px; }
  .diagram-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; }

  .pistes { display:grid; grid-template-columns: 1fr auto; gap:12px; }
  .piste { border:1px dashed #fcd34d; background:rgba(255,251,235,.6); border-radius:12px; padding:12px 16px; }
  .piste .label { margin:0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; color:var(--amber-700); }
  .piste .txt { margin:4px 0 0; font-size:14px; font-weight:600; line-height:1.35; color:var(--slate-700); }
  .tags { display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; }
  .tag { border-radius:999px; padding:4px 10px; font-size:12px; font-weight:900; }
  .tag-niv { background:#cffafe; color:var(--cyan-700); }
  .tag-not { background:#ccfbf1; color:var(--teal-700); }

  .cherche { border:2px dashed var(--slate-200); border-radius:16px; padding:24px 16px; text-align:center; }
  .cherche p { margin:0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.2em; color:var(--slate-300); }

  .foot { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--slate-100); padding-top:12px; }
  .foot .titre { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; color:var(--slate-400); }
  .foot .num { font-size:11px; font-weight:900; color:var(--slate-400); font-variant-numeric: tabular-nums; }

  /* Corrigés */
  .corr-head { display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--slate-100); padding:24px 24px 16px; }
  .corr-head .emo { font-size:24px; }
  .corr-head h2 { margin:0; font-size:24px; font-weight:900; color:var(--slate-900); }
  .corr-head p { margin:0; font-size:14px; font-weight:700; color:var(--slate-500); }
  .corr-list { list-style:none; margin:0; padding:20px 24px 28px; display:flex; flex-direction:column; gap:12px; }
  .corr-item { border:1px solid var(--slate-100); background:rgba(248,250,252,.6); border-radius:12px; padding:12px 16px; }
  .corr-q { margin:0; display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px; font-weight:900; color:var(--slate-800); }
  .corr-q .ref { border:1px solid var(--slate-300); border-radius:4px; padding:2px 6px; font-size:11px; color:var(--slate-500); font-variant-numeric: tabular-nums; }
  .corr-r { margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--slate-700); }

  @media (max-width: 640px) {
    .pistes { grid-template-columns: 1fr; }
    .cover h1 { font-size: 40px; }
    .question { font-size: 24px; }
  }

  @media print {
    @page { size: A4; margin: 8mm; }
    html, body { background:#fff !important; color:#0f172a !important; }
    .screen-only { display:none !important; }
    .wrap { max-width:none; padding:0; }
    .page { break-after: page; page-break-after: always; break-inside: avoid;
            margin-top:0; border:0; border-radius:0; box-shadow:none; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    .cover { min-height: 262mm; border-radius:0; }
  }
</style>

/* ------------------------------------------------------------------ */
/*  Petits utilitaires                                                 */
/* ------------------------------------------------------------------ */
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const cap = (c) => c.cap ? `<span class="cap">${c.cap}</span>` : "";

/* ------------------------------------------------------------------ */
/*  Rendu d'une cellule / scène d'icônes                               */
/* ------------------------------------------------------------------ */
function cellule(c) {
  if (c.t === "ic") {
    const shown = Math.min(c.n || 1, 6);
    let emos = "";
    for (let i = 0; i < shown; i++) emos += `<span class="emo">${c.e}</span>`;
    if ((c.n || 1) > shown) emos += `<span class="more">…</span>`;
    return `<div class="cell"><div class="icons">${emos}</div>${cap(c)}</div>`;
  }
  if (c.t === "val") return `<div class="cell"><span class="val">${c.v}</span>${cap(c)}</div>`;
  if (c.t === "qm")  return `<div class="cell"><span class="qm">?</span>${cap(c)}</div>`;
  return `<span class="op">${c.v}</span>`; // op
}
function scene(rows) {
  return `<div class="scene">${rows.map(r => `<div class="scene-row">${r.map(cellule).join("")}</div>`).join("")}</div>`;
}

    <svg viewBox="0 0 102 102" style="height:176px;width:176px" role="img" aria-label="Un jardin carré partagé en 6 parcelles carrées">

}

function frac(cx, cy, n, d) {
  return `<g fill="#1e293b">
    <text x="${cx}" y="${cy-3}" font-size="13" font-weight="800" text-anchor="middle">${n}</text>
    <line x1="${cx-9}" y1="${cy+1}" x2="${cx+9}" y2="${cy+1}" stroke="#1e293b" stroke-width="1.5"/>

  </g>`;
}
function diaCarreMagique() {
  const O = 8, C = 44;
  const ctr = [O+C/2, O+C+C/2, O+2*C+C/2];
  return `<div class="diagram-wrap">
    <svg viewBox="0 0 160 172" style="height:208px;width:208px" role="img" aria-label="Carré magique 3 sur 3 de fractions : centre 1/3, milieu-droite 1/3, bas-gauche 4/9, les autres cases sont à compléter">
      <g fill="none" stroke="#1e293b" stroke-width="2">
        <rect x="${O}" y="${O}" width="${3*C}" height="${3*C}"/>
        <line x1="${O+C}" y1="${O}" x2="${O+C}" y2="${O+3*C}"/>
        <line x1="${O+2*C}" y1="${O}" x2="${O+2*C}" y2="${O+3*C}"/>
        <line x1="${O}" y1="${O+C}" x2="${O+3*C}" y2="${O+C}"/>
        <line x1="${O}" y1="${O+2*C}" x2="${O+3*C}" y2="${O+2*C}"/>
      </g>
      ${frac(ctr[1],ctr[1],1,3)}
      ${frac(ctr[2],ctr[1],1,3)}
      ${frac(ctr[0],ctr[2],4,9)}
    </svg>
    <span class="diagram-cap">Complète les cases vides.</span>
  </div>`;
}
function gear(cx, cy, r, teeth, fill, stroke, hubFill, rot) {
  const th = Math.max(6, Math.round(r*0.2));
  const tw = Math.max(4, ((2*Math.PI*r)/teeth)*0.55);
  let dents = "";
  for (let i = 0; i < teeth; i++) {
    dents += `<rect x="${cx-tw/2}" y="${cy-r-th}" width="${tw}" height="${th+3}" rx="1" transform="rotate(${(360/teeth)*i} ${cx} ${cy})"/>`;
  }
  return `<g fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:""}>
    ${dents}
    <circle cx="${cx}" cy="${cy}" r="${r}"/>
    <circle cx="${cx}" cy="${cy}" r="${r*0.3}" fill="${hubFill}" stroke="${stroke}" stroke-width="1.5"/>
  </g>`;
}

function bouteille(x, fill) {

function verre(x, kind) {
  const topY = 30, w = 20, h = 32, inset = 3;
  const f = kind === "choc" ? "#92400e" : "#fffbeb";

  return `<path d="M${x},${topY} L${x+w},${topY} L${x+w-inset},${topY+h} L${x+inset},${topY+h} Z" fill="${f}" stroke="${s}" stroke-width="1.5" stroke-linejoin="round"/>`;
}
function diaChocolat() {
  const A = ["choc","choc","choc","lait","lait"];
  const B = ["choc","choc","lait"];
  return `<div class="diagram-wrap">
    <svg viewBox="0 0 232 96" style="width:100%;max-width:420px" role="img" aria-label="Mélange A : 3 verres de chocolat et 2 de lait. Mélange B : 2 verres de chocolat et 1 de lait.">

function diaAxe() {
  const y = 56, x0 = 40, u = 16;
  const xOf = (v) => x0 + (v+5)*u;
  let ticks = "";
  for (let v = -5; v <= 5; v++) ticks += `<line x1="${xOf(v)}" y1="${y-5}" x2="${xOf(v)}" y2="${y+5}" stroke="#cbd5e1" stroke-width="1.5"/>`;
  return `<div class="diagram-wrap">
    <svg viewBox="0 0 240 100" style="width:100%;max-width:420px" role="img" aria-label="Axe gradué horizontal : le point A est à −4, le point B est à 2 ; il faut placer le 0.">
      ${ticks}
      <line x1="20" y1="${y}" x2="224" y2="${y}" stroke="#1e293b" stroke-width="2"/>
      <path d="M224,${y} l-8,-4 v8 Z" fill="#1e293b"/>
      <line x1="${xOf(-4)}" y1="${y-12}" x2="${xOf(-4)}" y2="${y+12}" stroke="#d97706" stroke-width="2.5"/>
      <text x="${xOf(-4)}" y="${y-18}" font-size="13" font-weight="800" text-anchor="middle" fill="#b45309">A</text>
      <text x="${xOf(-4)}" y="${y+28}" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">−4 °C</text>
      <line x1="${xOf(2)}" y1="${y-12}" x2="${xOf(2)}" y2="${y+12}" stroke="#0891b2" stroke-width="2.5"/>
      <text x="${xOf(2)}" y="${y-18}" font-size="13" font-weight="800" text-anchor="middle" fill="#0e7490">B</text>
      <text x="${xOf(2)}" y="${y+28}" font-size="12" font-weight="800" text-anchor="middle" fill="#334155">2 °C</text>
    </svg>
    <span class="diagram-cap">Où placer le 0 ?</span>
  </div>`;
}
const DIAGRAMS = { carres:diaCarres, table:diaTable, boite:diaBoite, carremagique:diaCarreMagique, engrenages:diaEngrenages, bouteilles:diaBouteilles, chocolat:diaChocolat, axe:diaAxe };

/* ------------------------------------------------------------------ */
/*  Rendu d'une page-défi                                              */
/* ------------------------------------------------------------------ */
function pagePicto(p, index, total) {
  const illustration = p.diagram ? DIAGRAMS[p.diagram]() : scene(p.scene);
  return `<section class="page">
    <header class="band">
      <span class="theme"><span class="emo">${p.emoji}</span>${p.theme}</span>
      <span class="ref">${p.ref}</span>
    </header>
    <div class="body">
      <p class="lieu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${p.lieu}</p>
      <h2 class="question">${p.question}</h2>
      <div class="ardoise">
        ${p.enonce ? `<p class="enonce">${p.enonce}</p>` : ""}
        ${illustration}
      </div>
      <div class="pistes">
        <div class="piste">
          <p class="label">💡 Un coup de pouce</p>
          <p class="txt">${p.piste}</p>
        </div>
        <div class="tags">
          <span class="tag tag-niv">${p.niveau}</span>
          <span class="tag tag-not">${p.notion}</span>
        </div>
      </div>
      <div class="cherche"><p>Mon ardoise — je cherche ici</p></div>
      <div class="foot">
        <span class="titre">${LIVRET.titre} · ${LIVRET.domaine}</span>
        <span class="num">Défi ${index+1} / ${total}</span>
      </div>
    </div>
  </section>`;
}

/* ------------------------------------------------------------------ */
/*  Couverture + corrigés                                              */
/* ------------------------------------------------------------------ */
function cover() {
  return `<section class="page cover">
    <span class="volcan">🌋</span>
    <p class="chip chip-badge">✦ Défis à imprimer</p>
    <h1>${LIVRET.titre}<span class="dom">${LIVRET.domaine}</span></h1>
    <p class="baseline">${LIVRET.baseline}</p>
    <p class="chip look">👀 Regarde le dessin… et cherche !</p>
    <p class="intro">${LIVRET.intro}</p>
    <div class="chips">
      <span class="chip c-cyan">${PICTOS.length} défis</span>
      <span class="chip c-teal">CM2 → 3ᵉ</span>
      <span class="chip c-amber">1 image · 1 question</span>
    </div>
  </section>`;
}
function corriges() {
  const items = PICTOS.map(p => `<li class="corr-item">
    <p class="corr-q"><span class="ref">${p.ref}</span><span>${p.emoji}</span>${p.question}</p>
    <p class="corr-r">${p.reponse}</p>
  </li>`).join("");
  return `<section class="page">
    <header class="corr-head">
      <span class="emo">✅</span>
      <div>
        <h2>Les corrigés</h2>
        <p>À regarder après avoir cherché !</p>
      </div>
    </header>
    <ol class="corr-list">${items}</ol>
  </section>`;
}

/* ------------------------------------------------------------------ */
/*  Montage                                                            */
/* ------------------------------------------------------------------ */
const app = document.getElementById("app");
let html = cover();
PICTOS.forEach((p, i) => { html += pagePicto(p, i, PICTOS.length); });
html += corriges();
app.innerHTML = html;
</script>
