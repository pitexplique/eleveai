<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="L'aiguille rouge de Kakeya glisse et tourne à l'intérieur du deltoïde à trois pointes, la figure qui permet le demi-tour le plus économe : une aire de π/8.">
  <defs>
    <pattern id="grille-kakeya" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#ccd8ee" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- le papier à carreaux, comme sa feuille de brouillon -->
  <rect width="800" height="450" fill="#fbfcfe"/>
  <rect width="800" height="450" fill="url(#grille-kakeya)"/>

  <!-- le deltoïde et l'aiguille qui fait demi-tour dedans -->
  <g transform="translate(400 218)">
    <!-- la zone balayée (π/8), peinte -->
    <path d="M 210 0 Q 17.5 30.3 -105 181.9 Q -35 0 -105 -181.9 Q 17.5 -30.3 210 0 Z"
          fill="#f3c9c2" fill-opacity="0.55"/>
    <!-- le deltoïde : trois pointes, la figure du record classique -->
    <path d="M 210 0 Q 17.5 30.3 -105 181.9 Q -35 0 -105 -181.9 Q 17.5 -30.3 210 0 Z"
          fill="none" stroke="#1f3a67" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6"/>
    <!-- l'aiguille : son centre suit un cercle pendant qu'elle tourne de 180° -->
    <g>
      <g>
        <line x1="-140" y1="0" x2="140" y2="0" stroke="#c2352b" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-140" cy="0" r="7" fill="#c2352b"/>
        <circle cx="140" cy="0" r="7" fill="#c2352b"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-180" dur="9s" repeatCount="indefinite"/>
      </g>
      <animateMotion dur="9s" repeatCount="indefinite" path="M 70 0 A 70 70 0 1 1 -70 0 A 70 70 0 1 1 70 0"/>
    </g>
  </g>

  <!-- l'aire, en étiquette -->
  <g transform="translate(96 58)">
    <rect x="-26" y="-24" width="336" height="44" rx="8" fill="#ffffff" stroke="#ccd9ec" stroke-width="1.5"/>
    <text x="-10" y="6" font-family="ui-monospace, SFMono-Regular, monospace" font-size="19" font-weight="700" fill="#1f3a67">aire balayée = π/8 ≈ 0,39</text>
  </g>

  <!-- le clin d'œil à son tableau -->
  <text x="712" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" fill="#5f7396">F′ ⊆ F</text>

  <!-- la manchette -->
  <text x="60" y="398" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" fill="#1f3a67">Hong Wang · Médaille Fields 2026</text>
  <text x="60" y="422" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5f7396">le problème de l'aiguille (1917) — sa conjecture 3D fermée en 2025</text>
</svg>
