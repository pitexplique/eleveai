<?xml version="1.0" encoding="UTF-8"?>
<!-- La carte de l'article « Le but qui sort de la moyenne » : le dessin de
     Frédéric au stylo (22/07), né d'une phrase de Mbappé — on progresse en
     cultivant ses qualités, pas seulement en comblant ses défauts. À gauche,
     la loi normale : des ballons qui tombent et s'empilent en cloche, tout le
     monde se ressemble. À droite, un ballon doré s'échappe loin dans la queue
     de la loi de Pareto — c'est là que naissent les records. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
<defs>
  <pattern id="carreaux-p" width="25" height="25" patternUnits="userSpaceOnUse">
    <rect width="25" height="25" fill="#fbfdf9"/>
    <path d="M25 0H0V25" fill="none" stroke="#cfe8d4" stroke-width="1"/>
  </pattern>
  <style><![CDATA[
    .encre{stroke:#1f6b3a;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .trace{stroke-dasharray:100;stroke-dashoffset:100;animation:trace ease forwards}
    .pop{opacity:0;animation:pop .7s ease forwards}
    .ball{opacity:0;animation:fall .7s cubic-bezier(.45,0,.55,1) forwards}
    .main{font-family:'Segoe Print','Bradley Hand',cursive;fill:#1f6b3a}
    .or{fill:#c8962a}
    @keyframes trace{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1}}
    @keyframes fall{from{transform:translateY(-360px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes flyGoal{
      0%{opacity:0;transform:translate(0,0)}
      12%{opacity:1}
      100%{opacity:1;transform:translate(430px,-8px)}
    }
    .goal{opacity:0;animation:flyGoal 1.6s ease-in-out forwards;animation-delay:2.2s}
  ]]></style>
</defs>

<rect width="800" height="480" fill="url(#carreaux-p)"/>
<line x1="26" y1="0" x2="26" y2="480" stroke="#f3b6b6" stroke-width="2" opacity=".7"/>

<!-- ACTE 1 : la pluie de ballons qui s'empile en cloche (la loi normale) -->
<!-- colonne 1 -->
<circle class="ball" style="animation-delay:.1s"  cx="95"  cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne 2 -->
<circle class="ball" style="animation-delay:.25s" cx="128" cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.4s"  cx="128" cy="318" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne 3 -->
<circle class="ball" style="animation-delay:.3s"  cx="161" cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.5s"  cx="161" cy="318" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.7s"  cx="161" cy="296" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne centrale -->
<circle class="ball" style="animation-delay:.35s" cx="194" cy="340" r="11" fill="#cfe6d5" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.55s" cx="194" cy="318" r="11" fill="#cfe6d5" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.75s" cx="194" cy="296" r="11" fill="#cfe6d5" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.95s" cx="194" cy="274" r="11" fill="#cfe6d5" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne 5 -->
<circle class="ball" style="animation-delay:.45s" cx="227" cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.65s" cx="227" cy="318" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.85s" cx="227" cy="296" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne 6 -->
<circle class="ball" style="animation-delay:.5s"  cx="260" cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<circle class="ball" style="animation-delay:.7s"  cx="260" cy="318" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>
<!-- colonne 7 -->
<circle class="ball" style="animation-delay:.6s"  cx="293" cy="340" r="11" fill="#dfeee3" stroke="#1f6b3a" stroke-width="1.5"/>

<!-- la cloche tracée par-dessus les ballons -->
<path class="encre trace" pathLength="100" style="animation-duration:1.6s;animation-delay:1.2s;stroke-width:3"
  d="M70 350 C150 348 168 262 194 262 C220 262 238 348 318 350"/>
<line class="encre trace" pathLength="100" style="animation-duration:.5s;animation-delay:1.1s;stroke-width:2"
  x1="66" y1="350" x2="322" y2="350"/>
<text class="pop main" style="animation-delay:1.9s;font-size:16px" text-anchor="middle" x="194" y="378">la loi normale &#8212; tout le monde se ressemble</text>

<!-- ACTE 2 : le ballon doré qui s'échappe de la cloche vers la queue -->
<!-- la traînée -->
<path class="trace" pathLength="100" style="stroke:#c8962a;fill:none;stroke-width:2.5;stroke-dasharray:6 7;animation-duration:1.4s;animation-delay:2.3s"
  d="M210 250 C330 150 470 250 640 330"/>
<g class="goal">
  <circle cx="210" cy="250" r="13" class="or" stroke="#8a6410" stroke-width="1.5"/>
  <path d="M203 250 h14 M210 243 v14" stroke="#8a6410" stroke-width="1.2" fill="none"/>
</g>

<!-- ACTE 3 : la courbe de Pareto — la longue queue où atterrit le ballon -->
<path class="encre trace" pathLength="100" style="stroke:#c8962a;animation-duration:1.6s;animation-delay:3.6s;stroke-width:3.5"
  d="M470 180 C500 300 520 330 560 335 C620 342 690 335 760 333"/>
<line class="encre trace" pathLength="100" style="stroke:#c8962a;animation-duration:.5s;animation-delay:3.5s;stroke-width:2"
  x1="466" y1="350" x2="770" y2="350"/>
<!-- le ballon record posé sur la queue -->
<circle class="pop or" style="animation-delay:5s" cx="640" cy="330" r="9" stroke="#8a6410" stroke-width="1.5"/>
<text class="pop or" style="animation-delay:5.2s;font-family:'Segoe Print','Bradley Hand',cursive;font-size:15px" text-anchor="middle" x="648" y="312">&#9917; le record</text>
<text class="pop" style="animation-delay:4s;font-family:'Segoe Print','Bradley Hand',cursive;fill:#c8962a;font-size:16px" text-anchor="middle" x="600" y="378">la loi de Pareto &#8212; la queue des records</text>

<!-- signature -->
<text class="pop main" style="animation-delay:5.6s;font-size:23px" text-anchor="middle" x="400" y="446">Le record n&#8217;est pas dans la moyenne. Il est dans la queue.</text>
</svg>
