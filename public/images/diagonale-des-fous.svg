<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Le profil de La Réunion, de Saint-Pierre à Saint-Denis, avec un coureur de la Diagonale des Fous sur la crête.">
  <defs>
    <pattern id="grille-ddf" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#cfe8d4" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- papier à carreaux -->
  <rect width="800" height="440" fill="#fbfdf9"/>
  <rect width="800" height="440" fill="url(#grille-ddf)"/>

  <!-- le soleil des Hauts -->
  <circle cx="678" cy="86" r="30" fill="#f4c752"/>
  <g stroke="#f4c752" stroke-width="3" stroke-linecap="round">
    <line x1="678" y1="30" x2="678" y2="44"/>
    <line x1="734" y1="86" x2="720" y2="86"/>
    <line x1="718" y1="46" x2="708" y2="56"/>
    <line x1="638" y1="46" x2="648" y2="56"/>
  </g>

  <!-- la crête arrière (profondeur) -->
  <path d="M 40 400 L 40 384 L 180 214 L 300 300 L 430 214 L 545 176 L 665 286 L 760 392 L 760 400 Z"
        fill="#1f6b3a" fill-opacity="0.16"/>

  <!-- l'île : la crête avant -->
  <path d="M 40 400 L 40 360 L 150 150 L 232 252 L 330 150 L 442 272 L 560 110 L 652 224 L 760 372 L 760 400 Z"
        fill="#1f6b3a" fill-opacity="0.14"/>
  <path d="M 40 360 L 150 150 L 232 252 L 330 150 L 442 272 L 560 110 L 652 224 L 760 372"
        fill="none" stroke="#1f6b3a" stroke-width="3" stroke-linejoin="round"/>

  <!-- le chemin déjà couru (Saint-Pierre → le coureur) -->
  <path d="M 40 360 L 150 150 L 232 252 L 330 150"
        fill="none" stroke="#e0561a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ce qu'il reste, en pointillés -->
  <path d="M 330 150 L 442 272 L 560 110 L 652 224 L 760 372"
        fill="none" stroke="#e0561a" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 8" stroke-opacity="0.7"/>

  <!-- le coureur -->
  <circle cx="330" cy="150" r="8.5" fill="#e0561a" stroke="#ffffff" stroke-width="2.5"/>

  <!-- départ : Saint-Pierre -->
  <circle cx="40" cy="360" r="4" fill="#1f6b3a"/>
  <text x="40" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f6b3a">Saint-Pierre</text>
  <text x="40" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f8a6d">départ · 0 km</text>

  <!-- arrivée : Saint-Denis -->
  <g transform="translate(760 372)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#22402c" stroke-width="2.5"/>
    <path d="M 0 -30 L 22 -24 L 0 -18 Z" fill="#22402c"/>
    <rect x="2" y="-29" width="6" height="5" fill="#ffffff"/>
    <rect x="14" y="-27" width="6" height="5" fill="#ffffff"/>
  </g>
  <text x="758" y="392" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f6b3a">Saint-Denis</text>
  <text x="758" y="410" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f8a6d">arrivée · 165 km</text>

  <!-- l'équation, en étiquette -->
  <g transform="translate(112 66)">
    <rect x="-24" y="-22" width="300" height="40" rx="8" fill="#ffffff" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="-8" y="4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#1f6b3a">dR/dt = −k · effort² · (1+pente)</text>
  </g>
</svg>
