<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" role="img" aria-label="Un coureur de la Diagonale des Fous traverse le profil de La Réunion, de Saint-Pierre à Saint-Denis ; son tracé se dessine derrière lui.">
  <defs>
    <pattern id="grille-ddf" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#cfe8d4" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- papier à carreaux -->
  <rect width="800" height="450" fill="#fbfdf9"/>
  <rect width="800" height="450" fill="url(#grille-ddf)"/>

  <!-- le soleil des Hauts (rayons qui tournent lentement) -->
  <g transform="translate(678 82)">
    <g stroke="#f4c752" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-40"/>
      <line x1="0" y1="52" x2="0" y2="40"/>
      <line x1="-52" y1="0" x2="-40" y2="0"/>
      <line x1="52" y1="0" x2="40" y2="0"/>
      <line x1="-37" y1="-37" x2="-28" y2="-28"/>
      <line x1="37" y1="-37" x2="28" y2="-28"/>
      <line x1="-37" y1="37" x2="-28" y2="28"/>
      <line x1="37" y1="37" x2="28" y2="28"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
    <circle r="30" fill="#f4c752"/>
  </g>

  <!-- la crête arrière (profondeur) -->
  <path d="M 40 410 L 120 210 L 260 300 L 400 215 L 520 175 L 640 285 L 760 400 L 760 410 Z"
        fill="#1f6b3a" fill-opacity="0.16"/>

  <!-- l'île : la montagne pleine -->
  <path d="M 70 355 L 160 150 L 240 250 L 340 150 L 450 280 L 565 115 L 660 235 L 745 360 L 745 410 L 70 410 Z"
        fill="#1f6b3a" fill-opacity="0.14"/>
  <!-- la crête (sert AUSSI de rail au coureur : id=ridge) -->
  <path id="ridge" d="M 70 355 L 160 150 L 240 250 L 340 150 L 450 280 L 565 115 L 660 235 L 745 360"
        fill="none" stroke="#1f6b3a" stroke-width="3" stroke-linejoin="round"/>

  <!-- le tracé qui se dessine derrière le coureur -->
  <path d="M 70 355 L 160 150 L 240 250 L 340 150 L 450 280 L 565 115 L 660 235 L 745 360"
        fill="none" stroke="#e0561a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- le coureur : il suit la crête -->
  <g>
    <circle r="9" fill="#e0561a" stroke="#ffffff" stroke-width="3"/>
    <circle r="9" fill="none" stroke="#e0561a" stroke-width="2" stroke-opacity="0.5">
      <animate attributeName="r" from="9" to="17" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="0">
      <mpath xlink:href="#ridge"/>
    </animateMotion>
  </g>

  <!-- départ : Saint-Pierre -->
  <circle cx="70" cy="355" r="4" fill="#1f6b3a"/>
  <text x="70" y="388" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f6b3a">Saint-Pierre</text>
  <text x="70" y="406" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f8a6d">départ · 0 km</text>

  <!-- arrivée : Saint-Denis (drapeau) -->
  <g transform="translate(745 360)">
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#22402c" stroke-width="2.5"/>
    <path d="M 0 -32 L 24 -25 L 0 -18 Z" fill="#22402c"/>
    <rect x="2" y="-31" width="6.5" height="5.5" fill="#ffffff"/>
    <rect x="15" y="-29" width="6.5" height="5.5" fill="#ffffff"/>
  </g>
  <text x="742" y="388" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f6b3a">Saint-Denis</text>
  <text x="742" y="406" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5f8a6d">arrivée · 165 km</text>

  <!-- l'équation, en étiquette -->
  <g transform="translate(112 60)">
    <rect x="-26" y="-22" width="308" height="40" rx="8" fill="#ffffff" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="-10" y="4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#1f6b3a">dR/dt = −k · effort² · (1+pente)</text>
  </g>
</svg>
