<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Un hôtel de Terre-Sainte au crépuscule : socle turquoise, bande de bois verticale à l'angle, balcons à garde-corps sombres, chauffe-eau solaires sur le toit — 27 baies allumées sur 36 chambres, la mer derrière">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1c2e"/>
      <stop offset="55%" stop-color="#2b4a63"/>
      <stop offset="100%" stop-color="#c9743f"/>
    </linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d5266"/>
      <stop offset="100%" stop-color="#0e3549"/>
    </linearGradient>
  </defs>

  <!-- Le ciel du soir sur Saint-Pierre -->
  <rect width="1200" height="500" fill="url(#ciel)"/>
  <circle cx="1010" cy="140" r="26" fill="#f7f0da" opacity="0.9"/>
  <g fill="#f7f0da" opacity="0.5">
    <circle cx="150" cy="104" r="3"/><circle cx="298" cy="70" r="2.4"/>
    <circle cx="470" cy="126" r="2.6"/><circle cx="700" cy="84" r="2.2"/>
    <circle cx="1112" cy="112" r="2.8"/><circle cx="76" cy="192" r="2.2"/>
  </g>

  <!-- La mer, derrière : Terre-Sainte regarde le large -->
  <rect y="500" width="1200" height="140" fill="url(#mer)"/>
  <g fill="none" stroke="#4f9db4" stroke-width="4" opacity="0.5">
    <path d="M0,530 Q60,518 120,530 T240,530 T360,530 T480,530 T600,530 T720,530 T840,530 T960,530 T1080,530 T1200,530"/>
    <path d="M0,572 Q60,560 120,572 T240,572 T360,572 T480,572 T600,572 T720,572 T840,572 T960,572 T1080,572 T1200,572" opacity="0.7"/>
    <path d="M0,614 Q60,602 120,614 T240,614 T360,614 T480,614 T600,614 T720,614 T840,614 T960,614 T1080,614 T1200,614" opacity="0.45"/>
  </g>
  <g fill="#f7f0da" opacity="0.26">
    <rect x="990" y="512" width="42" height="6" rx="3"/>
    <rect x="982" y="548" width="58" height="6" rx="3"/>
    <rect x="994" y="586" width="34" height="6" rx="3"/>
  </g>

  <!-- La rue et le sable de Terre-Sainte -->
  <rect y="640" width="1200" height="260" fill="#16293a"/>
  <rect y="640" width="1200" height="22" fill="#c9b98f" opacity="0.32"/>
  <rect y="800" width="1200" height="100" fill="#101f2c"/>
  <g stroke="#8fb3c9" stroke-width="5" opacity="0.25" stroke-dasharray="46 40">
    <path d="M0,858 L1200,858"/>
  </g>

  <!-- ── LA FAÇADE ────────────────────────────────────────────────────── -->
  <!-- Les toitures en sheds, penchées -->
  <g fill="#26323a">
    <polygon points="190,412 374,412 374,382 190,340"/>
    <polygon points="380,412 564,412 564,382 380,340"/>
    <polygon points="570,412 754,412 754,382 570,340"/>
    <polygon points="760,412 950,412 950,382 760,340"/>
  </g>
  <!-- Les chauffe-eau solaires : à La Réunion, le soleil paie les douches -->
  <g fill="#f5b942" opacity="0.82">
    <rect x="238" y="316" width="150" height="17" rx="2"/>
    <rect x="452" y="316" width="150" height="17" rx="2"/>
    <rect x="666" y="316" width="150" height="17" rx="2"/>
  </g>

  <!-- Le corps du bâtiment -->
  <rect x="190" y="412" width="670" height="388" fill="#e9eef1"/>
  <!-- Les dalles blanches entre les étages -->
  <g fill="#f7fafb">
    <rect x="190" y="412" width="670" height="8"/>
    <rect x="190" y="508" width="670" height="8"/>
    <rect x="190" y="604" width="670" height="8"/>
  </g>

  <!-- Les garde-corps des balcons, à claire-voie — 26 chambres, 9 + 9 + 8 -->
  <g fill="#2f3a40">
    <rect x="216" y="469" width="58" height="39"/><rect x="286" y="469" width="58" height="39"/><rect x="356" y="469" width="58" height="39"/><rect x="426" y="469" width="58" height="39"/><rect x="496" y="469" width="58" height="39"/><rect x="566" y="469" width="58" height="39"/><rect x="636" y="469" width="58" height="39"/><rect x="706" y="469" width="58" height="39"/>
    <rect x="216" y="565" width="58" height="39"/><rect x="286" y="565" width="58" height="39"/><rect x="356" y="565" width="58" height="39"/><rect x="426" y="565" width="58" height="39"/><rect x="496" y="565" width="58" height="39"/><rect x="566" y="565" width="58" height="39"/><rect x="636" y="565" width="58" height="39"/><rect x="706" y="565" width="58" height="39"/><rect x="776" y="565" width="58" height="39"/>
    <rect x="216" y="661" width="58" height="39"/><rect x="286" y="661" width="58" height="39"/><rect x="356" y="661" width="58" height="39"/><rect x="426" y="661" width="58" height="39"/><rect x="496" y="661" width="58" height="39"/><rect x="566" y="661" width="58" height="39"/><rect x="636" y="661" width="58" height="39"/><rect x="706" y="661" width="58" height="39"/><rect x="776" y="661" width="58" height="39"/>
  </g>
  <g stroke="#4a585f" stroke-width="2">
    <path d="M216,488 H764 M216,584 H834 M216,680 H834"/>
  </g>

  <!-- Les baies : allumée = nuit vendue, à la couleur de sa catégorie.
       19 sur 26 (70 %) : 10 Supérieures, 6 Deluxe, 3 Familiales. -->
  <!-- Les Supérieures (ambre) : 10 allumées sur 14 -->
  <g fill="#f5b942" stroke="#ffe9c2" stroke-width="2">
    <rect x="216" y="612" width="58" height="49"/><rect x="286" y="612" width="58" height="49"/><rect x="356" y="612" width="58" height="49"/><rect x="426" y="612" width="58" height="49"/><rect x="496" y="612" width="58" height="49"/><rect x="566" y="612" width="58" height="49"/><rect x="636" y="612" width="58" height="49"/><rect x="706" y="612" width="58" height="49"/><rect x="776" y="612" width="58" height="49"/>
    <rect x="216" y="516" width="58" height="49"/>
  </g>
  <!-- Les Deluxe (turquoise) : 6 allumées sur 8 -->
  <g fill="#4fd1c5" stroke="#ffe9c2" stroke-width="2">
    <rect x="566" y="516" width="58" height="49"/><rect x="636" y="516" width="58" height="49"/><rect x="706" y="516" width="58" height="49"/><rect x="776" y="516" width="58" height="49"/>
    <rect x="216" y="420" width="58" height="49"/><rect x="286" y="420" width="58" height="49"/>
  </g>
  <!-- Les Familiales (corail) : 3 allumées sur 4 -->
  <g fill="#ff9d7a" stroke="#ffe9c2" stroke-width="2">
    <rect x="496" y="420" width="58" height="49"/><rect x="566" y="420" width="58" height="49"/><rect x="636" y="420" width="58" height="49"/>
  </g>
  <!-- Les chambres restées libres -->
  <g fill="#243038" stroke="#38474f" stroke-width="2">
    <rect x="286" y="516" width="58" height="49"/><rect x="356" y="516" width="58" height="49"/><rect x="426" y="516" width="58" height="49"/><rect x="496" y="516" width="58" height="49"/>
    <rect x="356" y="420" width="58" height="49"/><rect x="426" y="420" width="58" height="49"/><rect x="706" y="420" width="58" height="49"/>
  </g>

  <!-- La bande de bois verticale, à l'angle — la signature de la maison -->
  <rect x="860" y="400" width="90" height="400" fill="#b58154"/>
  <g stroke="#9a6a41" stroke-width="3">
    <path d="M875,400 V800 M890,400 V800 M905,400 V800 M920,400 V800 M935,400 V800"/>
  </g>
  <g fill="#f7fafb" font-family="ui-monospace, monospace" font-size="26" font-weight="700" text-anchor="middle">
    <text x="905" y="456">H</text><text x="905" y="492">Ô</text><text x="905" y="528">T</text><text x="905" y="564">E</text><text x="905" y="600">L</text>
    <text x="905" y="654">B</text><text x="905" y="690">A</text><text x="905" y="726">R</text>
  </g>

  <!-- Le rez-de-chaussée : le socle turquoise, le bar, l'accueil -->
  <rect x="190" y="700" width="420" height="100" fill="#17a2a8"/>
  <rect x="610" y="700" width="250" height="100" fill="#b9c4ca"/>
  <rect x="216" y="726" width="172" height="34" rx="3" fill="#f7fafb" opacity="0.94"/>
  <text x="302" y="750" fill="#17a2a8" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">LE TERRE SAINTE</text>
  <g fill="#ffd98a" opacity="0.78">
    <rect x="410" y="722" width="50" height="58" rx="2"/><rect x="472" y="722" width="50" height="58" rx="2"/><rect x="534" y="722" width="50" height="58" rx="2"/>
  </g>
  <rect x="676" y="716" width="70" height="84" fill="#f5b942" opacity="0.92"/>
  <text x="711" y="704" fill="#20303a" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ACCUEIL</text>

  <!-- Les filaos de bord de mer -->
  <g stroke="#2c6b4f" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M96,800 L96,656"/>
    <path d="M96,656 q-56,-28 -74,-70 M96,656 q56,-28 74,-70 M96,656 q-22,-56 -4,-88 M96,656 q32,-50 52,-74"/>
    <path d="M1104,800 L1104,676"/>
    <path d="M1104,676 q-50,-24 -68,-62 M1104,676 q50,-24 68,-62 M1104,676 q-18,-50 -2,-78"/>
  </g>
  <rect x="86" y="654" width="22" height="148" fill="#1f4a3a"/>
  <rect x="1094" y="674" width="22" height="128" fill="#1f4a3a"/>

  <!-- La signature de la maison -->
  <text x="600" y="270" fill="#f5b942" font-family="ui-monospace, monospace" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="6">19 / 26 CHAMBRES</text>
  <text x="600" y="866" fill="#8fb3c9" font-family="ui-monospace, monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="3">UNE BAIE ALLUMÉE, UNE NUIT VENDUE — 70 %</text>
</svg>
