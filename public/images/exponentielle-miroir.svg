<?xml version="1.0" encoding="UTF-8"?>
<!-- La carte de l'article « Plus j'avance, plus ma vitesse augmente » : deux
     courbes en MIROIR autour de l'axe vertical — e^x qui s'envole (je progresse,
     ma vitesse grandit avec ma hauteur : f' = f) et e^(-x) qui s'efface (ce que
     je ne recharge pas : f' = -f). La loi qui unifie les deux : f' = k·f. Une
     petite voiture grimpe la courbe verte en ACCÉLÉRANT (elle démarre lente sur
     le plat, s'envole sur la pente). Tracé au stylo sur une feuille à carreaux. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="480" viewBox="0 0 800 480">
<defs>
  <pattern id="carreaux" width="25" height="25" patternUnits="userSpaceOnUse">
    <rect width="25" height="25" fill="#fcfcf7"/>
    <path d="M25 0H0V25" fill="none" stroke="#cfe0f2" stroke-width="1"/>
  </pattern>
  <style><![CDATA[
    .encre{stroke:#2b4a9b;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .vert{stroke:#1a7f37;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .ambre{stroke:#b97e12;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .trace{stroke-dasharray:100;stroke-dashoffset:100;animation:trace ease forwards}
    .pop{opacity:0;animation:pop .7s ease forwards}
    .main{font-family:'Segoe Print','Bradley Hand',cursive}
    @keyframes trace{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1}}
  ]]></style>
</defs>

<rect width="800" height="480" fill="url(#carreaux)"/>
<line x1="26" y1="0" x2="26" y2="480" stroke="#f3b6b6" stroke-width="2" opacity=".7"/>

<!-- l'axe vertical : le miroir -->
<line class="encre trace" pathLength="100" style="animation-duration:.7s;stroke-width:2;stroke-dasharray:6 7"
  x1="400" y1="66" x2="400" y2="392"/>
<!-- la ligne du sol -->
<line class="encre trace" pathLength="100" style="animation-duration:.9s;animation-delay:.4s;stroke-width:2"
  x1="120" y1="380" x2="690" y2="380"/>

<!-- e^x : je progresse (monte vers la droite) — la ROUTE de la voiture -->
<path id="courbeVerte" class="vert trace" pathLength="100" style="animation-duration:2s;animation-delay:1s;stroke-width:3.5"
  d="M160 374 C 320 362, 360 302, 400 250 S 560 104, 648 76"/>
<!-- e^(-x) : je m'efface (mirror, monte vers la gauche) — la route de l'ampoule -->
<path id="courbeAmbre" class="ambre trace" pathLength="100" style="animation-duration:2s;animation-delay:1.6s;stroke-width:3.5"
  d="M640 374 C 480 362, 440 302, 400 250 S 240 104, 152 76"/>

<!-- noms des courbes, x EN EXPOSANT -->
<text class="pop main" style="animation-delay:2.9s;font-size:34px;font-weight:bold;fill:#1a7f37" x="656" y="78">e<tspan dy="-13" font-size="20">x</tspan></text>
<text class="pop main" style="animation-delay:3.1s;font-size:34px;font-weight:bold;fill:#b97e12" text-anchor="end" x="144" y="78">e<tspan dy="-13" font-size="20">&#8722;x</tspan></text>

<!-- TITRE VERT : en bas à gauche (au-dessus du plat de la courbe verte) -->
<text class="pop main" style="animation-delay:3.3s;font-size:17px;fill:#1a7f37" text-anchor="middle" x="162" y="290">plus j&#8217;avance,<tspan x="162" dy="22">plus ma vitesse augmente</tspan></text>
<text class="pop main" style="animation-delay:3.6s;font-size:18px;font-weight:bold;fill:#1a7f37" text-anchor="middle" x="162" y="338">f &#8242; = f</text>

<!-- TITRE JAUNE : en bas à droite (au-dessus de la descente de la courbe jaune) -->
<text class="pop main" style="animation-delay:3.9s;font-size:17px;fill:#b97e12" text-anchor="middle" x="590" y="302">plus j&#8217;attends,<tspan x="590" dy="22">plus mon souvenir s&#8217;efface</tspan></text>
<text class="pop main" style="animation-delay:4.2s;font-size:18px;font-weight:bold;fill:#b97e12" text-anchor="middle" x="590" y="350">f &#8242; = &#8722;f</text>

<!-- le point de croisement : (0 ; 1) — le départ commun -->
<circle class="pop" style="animation-delay:2.6s" cx="400" cy="250" r="6" fill="#2b4a9b"/>

<!-- LA VOITURE : elle grimpe la courbe verte en accélérant (ease-in : lente sur
     le plat, rapide sur la pente). rotate=auto → elle se cabre en montant. -->
<g class="pop" style="animation-delay:3s">
  <g>
    <rect x="-20" y="-20" width="40" height="12" rx="3" fill="#1a7f37" stroke="#0f5a26" stroke-width="1.5"/>
    <path d="M-10 -20 L-4 -29 L10 -29 L16 -20 Z" fill="#1a7f37" stroke="#0f5a26" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-6" y="-28" width="12" height="7" rx="1.5" fill="#fcfcf7" opacity="0.9"/>
    <circle cx="-11" cy="-6" r="5" fill="#26324a"/>
    <circle cx="11" cy="-6" r="5" fill="#26324a"/>
    <circle cx="-11" cy="-6" r="1.6" fill="#cfe0f2"/>
    <circle cx="11" cy="-6" r="1.6" fill="#cfe0f2"/>
    <animateMotion dur="5s" begin="3s" repeatCount="indefinite" rotate="auto"
      calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.55 0 0.9 1">
      <mpath xlink:href="#courbeVerte"/>
    </animateMotion>
  </g>
</g>

<!-- L'AMPOULE : le souvenir. Elle part fraîche en haut à gauche et descend la
     courbe jaune en S'ÉTEIGNANT (vite au début, puis lentement) → « ce que je ne
     recharge pas s'efface ». Le miroir de la voiture. -->
<g opacity="0">
  <g>
    <circle r="17" fill="#ffd766">
      <animate attributeName="opacity" values="0.7;0.04" dur="5s" begin="3.6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;1" keySplines="0.1 0.6 0.3 1"/>
    </circle>
    <circle r="10" fill="#ffe08a" stroke="#b97e12" stroke-width="2"/>
    <path d="M-4 -1 Q0 -6 4 -1" fill="none" stroke="#b97e12" stroke-width="1.5"/>
    <path d="M-4 8 H4 M-3 11 H3" stroke="#8a7a55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <animate attributeName="opacity" values="1;0.95;0.32" dur="5s" begin="3.6s" repeatCount="indefinite"
    calcMode="spline" keyTimes="0;0.35;1" keySplines="0.3 0 0.6 1;0.2 0.5 0.4 1"/>
  <animateMotion dur="5s" begin="3.6s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.1 0.6 0.3 1">
    <mpath xlink:href="#courbeAmbre"/>
  </animateMotion>
</g>

<!-- la loi qui unifie les deux : f' = k·f -->
<text class="pop main" style="animation-delay:4.6s;font-size:30px;font-weight:bold;fill:#2b4a9b" text-anchor="middle" x="400" y="414">f &#8242; = k &#183; f</text>
<text class="pop main" style="animation-delay:5.1s;font-size:18px;fill:#2b4a9b" text-anchor="middle" x="400" y="444">La m&#234;me loi monte (k&#8202;&gt;&#8202;0) et descend (k&#8202;&lt;&#8202;0).</text>
</svg>
