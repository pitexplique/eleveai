<svg width="160" height="96" viewBox="0 0 160 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EleveAI</title>
  <desc id="desc">Logo EleveAI : epsilon, fleche, infini.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="8" x2="150" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#083A67"/>
      <stop offset="0.55" stop-color="#042640"/>
      <stop offset="1" stop-color="#071A2D"/>
    </linearGradient>
    <linearGradient id="gold" x1="25" y1="22" x2="134" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B8"/>
      <stop offset="0.45" stop-color="#F8C846"/>
      <stop offset="1" stop-color="#F2A11E"/>
    </linearGradient>
    <filter id="softGlow" x="4" y="3" width="152" height="90" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F8C846" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="150" height="86" rx="28" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="147" height="83" rx="26.5" stroke="white" stroke-opacity="0.16" stroke-width="3"/>

  <g filter="url(#softGlow)" fill="url(#gold)">
    <text
      x="30"
      y="62"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="58"
      font-style="italic"
      font-weight="700"
      letter-spacing="-3"
    >ε</text>
    <text
      x="101"
      y="63"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="57"
      font-style="italic"
      font-weight="700"
      letter-spacing="-4"
    >∞</text>
  </g>

  <g filter="url(#softGlow)" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M67 48H93" stroke-width="6"/>
    <path d="M85 38L96 48L85 58" stroke-width="6"/>
  </g>
